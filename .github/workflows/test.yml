name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
        shell: bash
        run: |
          set +e -uo pipefail
          B=/etc/ssl/certs/ca-certificates.crt
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 present: upgrading ca-certificates"
            sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
          fi
          dpkg-query -W ca-certificates
          FP=$(fps)
          N=$(printf '%s\n' "$FP" | grep -c .)
          PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
          G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
          X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
          echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
          if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ENG-5167: nightly, not a stable release. No stable Foundry drops emSign ECC Root CA - G3
      # (webpki-roots < 1.0.10). foundryup installs `nightly-<sha>` as that exact release tag,
      # and the version step fails if it resolves anything else. Keep in sync with .oss-scanner/Dockerfile.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-9089a6bfdca158b2ef268b3d60923bf1e0879fed

      # The default `run` shell is `bash -e` without pipefail, so `forge --version | grep` would
      # pass on a failing forge that still printed the pin. The assignment carries forge's status.
      - name: Show Forge version
        run: |
          version="$(forge --version)"
          printf '%s\n' "$version"
          printf '%s\n' "$version" | grep -F 9089a6bfdca158b2ef268b3d60923bf1e0879fed

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Check Sepolia fork RPC secret
        if: ${{ github.event_name == 'schedule' }}
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          if [ -z "$SEPOLIA_RPC_URL" ]; then
            diagnosis="SEPOLIA_RPC_URL repository Actions secret is required for scheduled Sepolia oracle-pool invariant runs."
            echo "$diagnosis" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$diagnosis"
            exit 1
          fi

      - name: Run ENG-3523 Sepolia oracle-pool invariants
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          FABRICA_REQUIRE_SEPOLIA_FV: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          forge test --match-contract Eng3523OraclePoolSepoliaForkTest -vvv
        id: eng3523-sepolia-fv

      # ENG-3925 extends the ENG-3523 suite, so this run also re-executes every round-1
      # invariant above against the round-2 stack's fixture. Kept as its own step so a
      # round-2 regression is named as one in the checks list.
      # ENG-4203: asserts the aggregator script's PINNED fact store against the real chain. The
      # unit suite etches a correct store at whatever address the pin names, so it cannot tell a
      # right pin from a wrong one; only this step can. It needs its own env block — the plain
      # "Run Forge tests" step above carries no SEPOLIA_RPC_URL, so without this the suite would
      # silently SKIP and report green while proving nothing.
      - name: Run ENG-4203 round-3 fact-store pin invariants
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          FABRICA_REQUIRE_SEPOLIA_FV: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          forge test --match-contract Eng4203Round3FactStorePinSepoliaForkTest -vvv
        id: eng4203-sepolia-pin

      - name: Run ENG-3925 Sepolia round-2 immutable-aggregator invariants
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          FABRICA_REQUIRE_SEPOLIA_FV: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          forge test --match-contract Eng3925ImmutableAggregatorSepoliaForkTest -vvv
        id: eng3925-sepolia-fv

  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    if: ${{ always() && failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
        shell: bash
        run: |
          set +e -uo pipefail
          B=/etc/ssl/certs/ca-certificates.crt
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 present: upgrading ca-certificates"
            sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
          fi
          dpkg-query -W ca-certificates
          FP=$(fps)
          N=$(printf '%s\n' "$FP" | grep -c .)
          PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
          G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
          X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
          echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
          if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
      - name: Determine status
        id: status
        run: |
          echo "status=failure" >> "$GITHUB_OUTPUT"
          echo "color=danger" >> "$GITHUB_OUTPUT"
          echo "emoji=:x:" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN not configured, skipping notification"
            exit 0
          fi
          response="$(curl --fail --silent --show-error -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "#engineering_robots",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ steps.status.outputs.emoji }} *fabrica-v3-contracts* CI ${{ steps.status.outputs.status }} on `${{ github.event_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|`${{ github.workflow }}` run ${{ github.run_id }}>"
                    }
                  }
                ]
              }]
            }')"
          if ! echo "$response" | jq -e '.ok == true' > /dev/null; then
            echo "Slack chat.postMessage rejected response:"
            echo "$response" | jq -c '.'
            exit 1
          fi
          ts="$(echo "$response" | jq -r '.ts // empty')"
          echo "Slack notification posted${ts:+: $ts}"
