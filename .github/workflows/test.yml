name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Check Sepolia fork RPC secret
        if: ${{ github.event_name == 'schedule' }}
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          if [ -z "$SEPOLIA_RPC_URL" ]; then
            diagnosis="SEPOLIA_RPC_URL repository Actions secret is required for scheduled Sepolia oracle-pool invariant runs."
            echo "$diagnosis" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$diagnosis"
            exit 1
          fi

      - name: Run ENG-3523 Sepolia oracle-pool invariants
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          FABRICA_REQUIRE_SEPOLIA_FV: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          forge test --match-contract Eng3523OraclePoolSepoliaForkTest -vvv
        id: eng3523-sepolia-fv

      # ENG-3925 extends the ENG-3523 suite, so this run also re-executes every round-1
      # invariant above against the round-2 stack's fixture. Kept as its own step so a
      # round-2 regression is named as one in the checks list.
      - name: Run ENG-3925 Sepolia round-2 immutable-aggregator invariants
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          FABRICA_REQUIRE_SEPOLIA_FV: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          forge test --match-contract Eng3925ImmutableAggregatorSepoliaForkTest -vvv
        id: eng3925-sepolia-fv

  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check]
    if: ${{ always() && failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Determine status
        id: status
        run: |
          echo "status=failure" >> "$GITHUB_OUTPUT"
          echo "color=danger" >> "$GITHUB_OUTPUT"
          echo "emoji=:x:" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "SLACK_BOT_TOKEN not configured, skipping notification"
            exit 0
          fi
          curl -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "channel": "#engineering_robots",
              "attachments": [{
                "color": "${{ steps.status.outputs.color }}",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "${{ steps.status.outputs.emoji }} *fabrica-v3-contracts* CI ${{ steps.status.outputs.status }} on `${{ github.event_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ github.sha }}`>\n*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|`${{ github.workflow }}` run ${{ github.run_id }}>"
                    }
                  }
                ]
              }]
            }'
