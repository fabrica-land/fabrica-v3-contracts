[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 1
via_ir = false

# Vendored MetaStreet contracts (src/metastreet/**) need viaIR + higher optimizer
# runs to compile cleanly without "Stack too deep". Mirrors upstream MetaStreet's
# hardhat config (viaIR: true, runs: 800, evmVersion: shanghai). Scoped to the
# metastreet/ tree so Fabrica's own contracts keep the original bytecode.
[[profile.default.additional_compiler_profiles]]
name = "metastreet"
via_ir = true
optimizer_runs = 800
evm_version = "shanghai"

[[profile.default.compilation_restrictions]]
paths = "src/metastreet/**"
via_ir = true
min_optimizer_runs = 800
min_evm_version = "shanghai"

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base-sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
