[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 1
via_ir = false

# Vendored MetaStreet contracts (src/fabrica-lending-pools/**) and test
# scaffolding that extends Pool (test/fabrica-lending-pools/**) need viaIR to
# compile cleanly without "Stack too deep". Mirrors upstream metastreet-
# contracts-v2's hardhat.config at SHA 8ed467d (viaIR: true,
# optimizer.runs: 100 for the contracts/configurations override that contains
# the deployable concretes, evmVersion: shanghai). We apply runs=1 across
# the whole vendored tree: Foundry can't replicate hardhat's per-file
# `overrides` within a single import graph, and runs=1 saves the few-dozen
# bytes Pool needs to fit its concrete configuration under EIP-170's
# 24576-byte runtime-bytecode limit with our Fabrica depositFor additions.
# bytecode_hash and cbor_metadata are stripped so the appended CBOR
# metadata trailer doesn't eat into the budget either.
[[profile.default.additional_compiler_profiles]]
name = "metastreet"
via_ir = true
optimizer_runs = 1
evm_version = "shanghai"
bytecode_hash = "None"
cbor_metadata = false

[[profile.default.compilation_restrictions]]
paths = "src/fabrica-lending-pools/**"
via_ir = true
min_optimizer_runs = 1
min_evm_version = "shanghai"

[[profile.default.compilation_restrictions]]
paths = "test/fabrica-lending-pools/**"
via_ir = true
min_optimizer_runs = 1
min_evm_version = "shanghai"

# Vendored MetaStreet sources are kept bit-for-bit with upstream
# (banner comment only — pragma matches upstream verbatim at 0.8.25).
# Skip forge fmt on this tree so `forge fmt --check` in CI does not
# try to reformat upstream-style code into Fabrica style.
[fmt]
ignore = ["src/fabrica-lending-pools/**/*.sol"]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base-sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
