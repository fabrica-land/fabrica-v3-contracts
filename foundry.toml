[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 1
via_ir = false

# Vendored MetaStreet contracts (src/fabrica-lending-pools/**) and test
# scaffolding that extends Pool (test/fabrica-lending-pools/**) need viaIR to
# compile cleanly without "Stack too deep". Mirrors upstream metastreet-
# contracts-v2's hardhat.config at SHA 8ed467d (viaIR: true,
# optimizer.runs: 100 for the contracts/configurations override that contains
# the deployable concretes, evmVersion: cancun). We apply runs=1 across
# the whole vendored tree: Foundry can't replicate hardhat's per-file
# `overrides` within a single import graph, and runs=1 saves the few-dozen
# bytes Pool needs to fit its concrete configuration under EIP-170's
# 24576-byte runtime-bytecode limit with our Fabrica depositFor additions.
# bytecode_hash and cbor_metadata are stripped so the appended CBOR
# metadata trailer doesn't eat into the budget either.
[[profile.default.additional_compiler_profiles]]
name = "metastreet"
via_ir = true
optimizer_runs = 1
evm_version = "cancun"
bytecode_hash = "None"
cbor_metadata = false

[[profile.default.compilation_restrictions]]
paths = "src/fabrica-lending-pools/**"
via_ir = true
min_optimizer_runs = 1
min_evm_version = "cancun"

[[profile.default.compilation_restrictions]]
paths = "test/fabrica-lending-pools/**"
via_ir = true
min_optimizer_runs = 1
min_evm_version = "cancun"

# Vendored MetaStreet sources are kept bit-for-bit with upstream
# (banner comment only — pragma matches upstream verbatim at 0.8.25).
# Skip forge fmt on this tree so `forge fmt --check` in CI does not
# try to reformat upstream-style code into Fabrica style.
# Per-chain library linking for the Fabrica lending-pool implementation.
#
# WeightedRateERC1155CollectionPool links 4 external libraries, all under
# src/fabrica-lending-pools/**: BorrowLogic, DepositLogic, LiquidityLogic,
# and ERC20DepositTokenFactory. On a clean checkout there is no link mapping,
# so vm.deployCode("WeightedRateERC1155CollectionPool.sol:...") in the
# Create/Upgrade scripts reverts with "no bytecode … unlinked".
#
# forge 1.5.1 cannot key `libraries` by chain (no [libraries.<chain>] table,
# no ${ENV} substitution inside the libraries array), so per-chain linking is
# expressed as top-level profiles selected with FOUNDRY_PROFILE=<chain>.
# Run the lending-pool Create/Upgrade scripts with the matching profile, e.g.
#   FOUNDRY_PROFILE=mainnet forge script script/FabricaLendingPoolUpgrade.s.sol ...
#   FOUNDRY_PROFILE=sepolia forge script script/FabricaLendingPoolUpgrade.s.sol ...
#
# Each `libraries` list contains ONLY the 4 pool-lib paths, so Foundry links
# them solely into contracts that reference them (the pool tree). Token,
# Validator, and the rest are untouched — the linking is scoped to the
# lending pool, not shared. Named profiles inherit the default profile's
# compilation_restrictions and the "metastreet" additional_compiler_profiles,
# so the pool still builds with via_ir / cancun / runs=1 under these profiles
# (verified via `FOUNDRY_PROFILE=<chain> forge config`).
#
# Addresses are each chain's canonical, currently-live deployments:
#   sepolia — recorded in
#     broadcast/FabricaLendingPoolStackDeploy.s.sol/11155111/ and confirmed
#     against the live pool implementation's on-chain bytecode.
#   mainnet — recovered from the live pool implementation's on-chain bytecode
#     (pool 0x842ffbf1ad5314503904626122376f71603a3cf9, beacon impl
#     0x4b1576Df8D8911d2F404391a7f8fAcEfA7F4b6da); no mainnet StackDeploy
#     broadcast exists in-repo.
[profile.mainnet]
libraries = [
    "src/fabrica-lending-pools/BorrowLogic.sol:BorrowLogic:0x6749f43BB2f4d5af0ce0fc3Fc4756Dc1d44F1d73",
    "src/fabrica-lending-pools/DepositLogic.sol:DepositLogic:0xEc7716d72990374EB4E5f72f3B60179F5256d39B",
    "src/fabrica-lending-pools/LiquidityLogic.sol:LiquidityLogic:0x07e2C0C066F231E57857B7fB3CD51E18D364AAB0",
    "src/fabrica-lending-pools/tokenization/ERC20DepositTokenFactory.sol:ERC20DepositTokenFactory:0x08ccc36252f61983EE04fd5946eA958bC195090c",
]

[profile.sepolia]
libraries = [
    "src/fabrica-lending-pools/BorrowLogic.sol:BorrowLogic:0x97bD28cd2EC4D226969221574f7EeBE301bf7557",
    "src/fabrica-lending-pools/DepositLogic.sol:DepositLogic:0xcab821709338df0f718491d0f3038fbD6a16CfbE",
    "src/fabrica-lending-pools/LiquidityLogic.sol:LiquidityLogic:0xc98899f5A7feFC5146C1574D6b51C0A5C993b505",
    "src/fabrica-lending-pools/tokenization/ERC20DepositTokenFactory.sol:ERC20DepositTokenFactory:0x8722651F6f79Bde509c48Fc65c37A3b8faf9086D",
]

[fmt]
ignore = ["src/fabrica-lending-pools/**/*.sol"]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base-sepolia = { key = "${ETHERSCAN_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
