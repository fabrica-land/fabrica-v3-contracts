[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 1
via_ir = false
# ENG-5167: pinned to the Foundry v1.5.1 defaults. Foundry 1.8.x changed them to osaka and isolate = true.
# isolate = true runs each call as its own transaction and breaks the cold/warm gas tests.
evm_version = "prague"
isolate = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
# base-sepolia / BASE_SEPOLIA_RPC_URL retired 2026-08-27 per Tim (ENG-3853)

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
# base-sepolia retired 2026-08-27 per Tim (ENG-3853)

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
